      METAETIQUETAS SEO Y METADATOS:
      
      1. Autor (author): Define el creador o la persona/empresa responsable del contenido de la página.
      2. Palabras clave (keywords): Contiene términos de búsqueda relevantes para ayudar a los motores de búsqueda a indexar el sitio.
      3. Descripción (description): Ofrece un resumen breve del contenido de la página que suele aparecer en los resultados de Google.
      4. Copyright (copyright): Indica los derechos de autor o la propiedad legal sobre el contenido del sitio web.
    -->
